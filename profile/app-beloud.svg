<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" role="img" aria-labelledby="title">
  <title id="title">Beloud, built at Safe Apps: a social news and video platform on Android.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f5f4f1; }
    .name { font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 18px; letter-spacing: -0.3px; }
    .dot { fill: #ef5748; }
    .line { font-size: 13px; fill: #8d8d93; }
    .tag { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; fill: #c9c8c4; }
    .owner { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; fill: #8d8d93; }
    .pill { fill: #16171a; stroke: #2e2f34; }
  </style>
  <defs>
    <clipPath id="icon"><rect x="18" y="18" width="52" height="52" rx="12"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="119" rx="10" fill="#0f1013" stroke="#26272b"/>
  <image href="data:image/webp;base64," x="18" y="18" width="52" height="52" clip-path="url(#icon)"/>
  <text class="owner" x="282" y="30" text-anchor="end">SAFE APPS</text>
  <text class="name" x="84" y="42">Beloud<tspan class="dot">.</tspan></text>
  <text class="line" x="84" y="62">Social news and video</text>
  <rect class="pill" x="18.5" y="88.5" width="70" height="18" rx="3"/>
  <text class="tag" x="53.5" y="101" text-anchor="middle">ANDROID</text>
</svg>
