<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" role="img" aria-labelledby="title">
  <title id="title">Beloud, built at Safe Apps: a social news and video platform on Android.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 15px; font-weight: 700; }
    .line { font-size: 12.5px; }
    .meta { font-size: 11.5px; }
    .bg { fill: #1a1918; stroke: #33312d; }
    .fg { fill: #e8e6dc; }
    .mut { fill: #9b9a93; }
    .dim { fill: #6b6a64; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #faf9f5; stroke: #e3dfd3; }
      .fg { fill: #141413; }
      .mut { fill: #73726c; }
      .dim { fill: #a3a29a; }
    }
  </style>
  <defs>
    <clipPath id="icon"><rect x="20" y="20" width="48" height="48" rx="11"/></clipPath>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="299" height="119" rx="10"/>
  <image href="data:image/webp;base64," x="20" y="20" width="48" height="48" clip-path="url(#icon)"/>
  <text class="name fg" x="82" y="40">Beloud</text>
  <text class="line mut" x="82" y="60">Social news and video</text>
  <text class="meta dim" x="20" y="100">android</text>
  <text class="meta dim" x="280" y="100" text-anchor="end">Safe Apps</text>
</svg>
