  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #e6edf3; }
    .t { font-size: 13px; fill: #8b949e; }
    .g { fill: #39d353; }
    .b { font-weight: 700; }
    .dim { fill: #484f58; }
    .a { animation: in 0.35s ease-out both; }
    .c { animation: type 0s steps(1, end) both; }
    .k { animation: type 2.4s steps(1, end) both, blink 1s steps(1) 2.4s infinite; }
    @keyframes in { from { opacity: 0; } }
    @keyframes type { from { visibility: hidden; } to { visibility: visible; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .a, .c, .k { animation: none; }
    }
  </style>
