<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-labelledby="title">
  <title id="title">Yassir Kazzoune, full stack developer in Morocco. I build backends, web apps and mobile apps. Backend: Spring Boot, Laravel, GraphQL, MySQL. Web: Vue, Nuxt. Mobile: Flutter, Kotlin. Available for work. yassirkazzoune.com</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .sm { font-size: 14px; }
    .xs { font-size: 13px; }
    .b { font-weight: 700; }
    .bg { fill: #1a1918; stroke: #33312d; }
    .fg { fill: #e8e6dc; }
    .mut { fill: #9b9a93; }
    .dim { fill: #6b6a64; }
    .acc { fill: #d77757; }
    .box { fill: none; stroke: #d77757; }
    .inbox { fill: none; stroke: #4a4844; }
    .tree { fill: none; stroke: #6b6a64; stroke-width: 1.2; }
    .cur { fill: #e8e6dc; }
    .a { animation: in 0.3s ease-out both; }
    .c { animation: type 0s steps(1, end) both; }
    .k { animation: type 2.1s steps(1, end) both, blink 1s steps(1) 2.1s infinite; }
    @keyframes in { from { opacity: 0; } }
    @keyframes type { from { visibility: hidden; } to { visibility: visible; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: light) {
      .bg { fill: #faf9f5; stroke: #e3dfd3; }
      .fg { fill: #141413; }
      .mut { fill: #73726c; }
      .dim { fill: #a3a29a; }
      .acc { fill: #c96442; }
      .box { stroke: #c96442; }
      .inbox { stroke: #c9c5b8; }
      .tree { stroke: #a3a29a; }
      .cur { fill: #141413; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a, .c, .k { animation: none; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="879" height="391" rx="12"/>

