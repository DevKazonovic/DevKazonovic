<svg xmlns="http://www.w3.org/2000/svg" width="880" height="272" viewBox="0 0 880 272" role="img" aria-labelledby="title">
  <title id="title">Yassir Kazzoune. I build backends, web apps and mobile apps. Full stack developer in Morocco. Portfolio: yassirkazzoune.com. Stack: Spring Boot, Laravel, GraphQL, MySQL, Vue, Nuxt, Flutter, Kotlin.</title>
  <style>
    text { fill: #141413; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 46px; letter-spacing: -0.5px; }
    .lede { font-size: 21px; fill: #3d3d3a; }
    .meta { font-size: 13px; fill: #87867f; }
    .stack { font-size: 12px; fill: #87867f; }
    .link { font-size: 14px; }
    .accent { fill: #c6371f; }
    .k { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .k { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="logo"><rect x="48" y="44" width="56" height="56" rx="13"/></clipPath>
  </defs>

  <rect width="880" height="272" rx="14" fill="#f0eee6"/>

  <image href="data:image/webp;base64," x="48" y="44" width="56" height="56" clip-path="url(#logo)"/>
  <text class="mono stack" x="832" y="76" text-anchor="end">Spring Boot · Laravel · GraphQL · MySQL · Vue · Nuxt · Flutter · Kotlin</text>

  <text class="serif name" x="48" y="170">Yassir Kazzoune</text>
  <text class="serif lede" x="48" y="206">I build backends, web apps and mobile apps.</text>
  <text class="sans meta" x="48" y="238">Full stack developer · Morocco</text>

  <text class="mono link" x="650" y="238" textLength="168" lengthAdjust="spacing"><tspan class="accent">&gt;</tspan> yassirkazzoune.com</text>
  <rect class="k" x="820" y="226" width="8" height="15" fill="#141413"/>
</svg>
