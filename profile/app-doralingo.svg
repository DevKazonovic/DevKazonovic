<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" role="img" aria-labelledby="title">
  <title id="title">Doralingo: an English learning platform on the web, Android and iOS.</title>
  <style>
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .name { font-size: 20px; fill: #141413; }
    .line { font-size: 13px; fill: #3d3d3a; }
    .meta { font-size: 12px; fill: #87867f; }
  </style>
  <defs>
    <clipPath id="icon"><rect x="22" y="22" width="48" height="48" rx="11"/></clipPath>
  </defs>
  <rect width="300" height="120" rx="12" fill="#f0eee6"/>
  <image href="data:image/webp;base64," x="22" y="22" width="48" height="48" clip-path="url(#icon)"/>
  <text class="serif name" x="84" y="43">Doralingo</text>
  <text class="sans line" x="84" y="63">English learning platform</text>
  <text class="sans meta" x="22" y="100">Web · Android · iOS</text>
</svg>
