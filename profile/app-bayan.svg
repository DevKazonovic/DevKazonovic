<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" role="img" aria-labelledby="title">
  <title id="title">Bayan: Quran recitations, streamed or offline, on the web and Android.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .name { font-size: 17px; font-weight: 600; }
    .line { font-size: 13px; fill: #8b949e; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #39d353; }
    .pill { fill: none; stroke: #238636; }
  </style>
  <defs>
    <clipPath id="icon"><rect x="18" y="18" width="52" height="52" rx="12"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="119" rx="10" fill="#0d1117" stroke="#30363d"/>
  <image href="data:image/webp;base64," x="18" y="18" width="52" height="52" clip-path="url(#icon)"/>
  <text class="name" x="84" y="41">Bayan</text>
  <text class="line" x="84" y="62">Quran recitations</text>
  <rect class="pill" x="18.5" y="86.5" width="38" height="19" rx="9.5"/>
  <text class="tag" x="37.5" y="100" text-anchor="middle">web</text>
  <rect class="pill" x="62.5" y="86.5" width="62" height="19" rx="9.5"/>
  <text class="tag" x="93.5" y="100" text-anchor="middle">android</text>
</svg>
