name: Update profile images

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&timezone=Africa/Casablanca&background=0D1117&border=30363D&stroke=30363D&ring=39D353&fire=39D353&currStreakNum=39D353&currStreakLabel=39D353&sideNums=E6EDF3&sideLabels=8B949E&dates=8B949E
          path: profile/streak.svg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update profile images" || exit 0
          git push
